name: Coffee V2.1 — P11 real corpus (private GitHub caller ONLY)

# Reusable workflow: must be invoked by a PRIVATE GitHub repository.
# Its caller's private release holds the authentic ZIP. The job and artifacts
# belong to the private caller, never to the public igc-modular repository.
on:
  workflow_call:
    inputs:
      source_release_tag:
        description: "Existing release tag in the PRIVATE caller repo containing the pinned ZIP"
        required: true
        type: string
    secrets:
      P11_CUSTODY_HMAC_KEY_B64:
        description: "Persistent base64 private key (>=32 bytes); NOT a new random key per run"
        required: true

permissions:
  contents: read

jobs:
  custodial-p11:
    name: Real ZIP → P01/P02 → P05 → P11 (private)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CODE_COMMIT: 50b146e2aa1eabd4fab260ab8914b989aae4bb4f
      PINNED_ZIP_SHA256: dd18a787a1ac3dcd065fe54bff9a2f567d945c60d16e7a646444dacaa6ffbef9
      RELEASE_TAG: ${{ inputs.source_release_tag }}
      PRIVATE_ROOT: ${{ github.workspace }}/coffee-p11-private
    steps:
      - name: Require private caller and valid tag BEFORE any download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid private release tag"; exit 1
          fi
          private="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')"
          if [[ "$private" != "true" ]]; then
            echo "::error::P11 real-data workflow refuses PUBLIC caller repositories"
            exit 1
          fi
          mkdir -p "$PRIVATE_ROOT/source" "$PRIVATE_ROOT/secret"

      - name: Checkout PUBLIC reference code at the fixed reviewed commit
        uses: actions/checkout@v4
        with:
          repository: yudocyudoc/igc-modular
          ref: 50b146e2aa1eabd4fab260ab8914b989aae4bb4f
          path: p11-code
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Retrieve exact authentic ZIP from PRIVATE GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'paquete_sintetico_pico_v1.zip' \
            --dir "$PRIVATE_ROOT/source"
          source="$PRIVATE_ROOT/source/paquete_sintetico_pico_v1.zip"
          test -f "$source"
          printf '%s  %s\n' "$PINNED_ZIP_SHA256" "$source" | sha256sum --check --status || {
            echo "::error::The authentic ZIP does not match the pinned source SHA"
            exit 1
          }

      - name: Restore persistent P12 key from PRIVATE GitHub secret
        env:
          CUSTODY_KEY_B64: ${{ secrets.P11_CUSTODY_HMAC_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$PRIVATE_ROOT/secret/custody-key.bin"
          printf '%s' "$CUSTODY_KEY_B64" | base64 --decode > "$key"
          if [ "$(wc -c < "$key")" -lt 32 ]; then
            echo "::error::The private custody key must contain >=32 bytes"
            exit 1
          fi

      - name: P01 P02 — verify original ZIP and create PRIVATE catalog
        working-directory: p11-code
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -m arena.coffee_v2_synthetic_corpus \
            --source "$PRIVATE_ROOT/source/paquete_sintetico_pico_v1.zip" \
            --key-file "$PRIVATE_ROOT/secret/custody-key.bin" \
            --private-out "$PRIVATE_ROOT/custody" \
            --public-out "$PRIVATE_ROOT/census-aggregates"

      - name: P02 P05 P12 — produce construction/development ONLY
        working-directory: p11-code
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -m arena.coffee_v2_producer_views \
            --source "$PRIVATE_ROOT/source/paquete_sintetico_pico_v1.zip" \
            --private-dir "$PRIVATE_ROOT/custody" \
            --out "$PRIVATE_ROOT/producer-views"

      - name: P11 — execute 26 paired comparisons and conditional economics
        working-directory: p11-code
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -m arena.coffee_v2_p11 \
            --views "$PRIVATE_ROOT/producer-views" \
            --dossier experiments/coffee_v2/EXAMPLE_REFERENCE_DOSSIER_ASSUMPTIONS_ONLY.json \
            --protocol experiments/coffee_v2/P11_INITIAL_CONDITIONAL_PROTOCOL_V1.json \
            --out "$PRIVATE_ROOT/results"

      - name: GitHub run-attestation (private, no source rows)
        env:
          GH_WORKFLOW_RUN_ID: ${{ github.run_id }}
          GH_WORKFLOW_ATTEMPT: ${{ github.run_attempt }}
          GH_PRIVATE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ["PRIVATE_ROOT"])
          outputs=root/"results"
          summary=json.loads((outputs/"p11-conditional-summary.json").read_text(encoding="utf-8"))
          receipt=json.loads((outputs/"receipt.json").read_text(encoding="utf-8"))
          attest={
            "schema":"arena.coffee-v2.p11-github-run-attestation/1",
            "run_platform":"GITHUB_ACTIONS_PRIVATE_CALLER",
            "caller_private_repository":os.environ["GH_PRIVATE_REPOSITORY"],
            "github_run_id":os.environ["GH_WORKFLOW_RUN_ID"],
            "github_run_attempt":os.environ["GH_WORKFLOW_ATTEMPT"],
            "code_commit_sha":os.environ["CODE_COMMIT"],
            "pinned_original_zip_sha256":os.environ["PINNED_ZIP_SHA256"],
            "producer_manifest_sha256":summary["source_manifest_sha256"],
            "protocol_sha256":receipt["protocol_sha256"],
            "dossier_sha256":receipt["dossier_sha256"],
            "conditional_summary_sha256":hashlib.sha256(
                (outputs/"p11-conditional-summary.json").read_bytes()).hexdigest(),
            "source_truth_evaluation_released":False,
            "business_validation_claimed":False,
            "raw_input_or_custody_key_in_artifact":False,
          }
          (outputs/"github-run-attestation.json").write_text(
             json.dumps(attest,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          s=summary["summary"]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("# P11: corrida sintética en GitHub privado\n\n")
              f.write(f"Commit: \`{attest['code_commit_sha']}\`\n\n")
              f.write(f"SHA del ZIP fijado: \`{attest['pinned_original_zip_sha256']}\`\n\n")
              f.write(f"Pares condicionales: {s['paired_counterfactual_model_runs']}\n\n")
              f.write(f"Celdas económicas hipotéticas: {s['conditional_economic_cells']}\n\n")
              f.write("**No es G3 ni validación empresarial.**\n")
          PY

      - name: Publish ONLY P11 outputs to PRIVATE caller artifact
        uses: actions/upload-artifact@v4
        with:
          name: coffee-p11-github-private-evidence
          path: |
            ${{ github.workspace }}/coffee-p11-private/results/paired-sensitivity.csv
            ${{ github.workspace }}/coffee-p11-private/results/economics-conditional.csv
            ${{ github.workspace }}/coffee-p11-private/results/p11-conditional-summary.json
            ${{ github.workspace }}/coffee-p11-private/results/REVIEW.md
            ${{ github.workspace }}/coffee-p11-private/results/receipt.json
            ${{ github.workspace }}/coffee-p11-private/results/github-run-attestation.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove ephemeral source, secret and private catalog
        if: always()
        shell: bash
        run: |
          rm -rf "$PRIVATE_ROOT"
