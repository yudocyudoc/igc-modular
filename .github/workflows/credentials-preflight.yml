name: Arena - preflight Cloudflare credentials (no physical run)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arena-credentials-readonly
  cancel-in-progress: false

jobs:
  provider:
    name: Read-only Workers AI access
    if: github.repository == 'yudocyudoc/igc-modular'
    environment: arena-provider
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check metadata access and deny R2 without inference
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m arena.cloud provider-preflight

  custodian:
    name: Read-only R2 access and CT03 reservation check
    if: github.repository == 'yudocyudoc/igc-modular'
    environment: arena-custodian
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify AWS CLI is available without installing extra components
        run: command -v aws
      - name: Check bucket read/list and existing reservation; never write
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CT03_R2_BUCKET: ${{ vars.CT03_R2_BUCKET || 'igc-ct03-private-custody' }}
          CT03_R2_ACCESS_KEY_ID: ${{ secrets.CT03_R2_ACCESS_KEY_ID }}
          CT03_R2_SECRET_ACCESS_KEY: ${{ secrets.CT03_R2_SECRET_ACCESS_KEY }}
        run: python -m arena.cloud storage-preflight
