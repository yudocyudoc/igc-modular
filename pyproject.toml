[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "igc-arena"
version = "0.1.0"
description = "Modular experiment coordinator with reusable connections and original IGC contracts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
vault = ["keyring>=25,<26"]
github-setup = ["PyNaCl>=1.5,<2"]

[project.scripts]
arena = "arena.cli:main"

[tool.setuptools]
packages = ["arena"]
include-package-data = true

[tool.setuptools.package-data]
arena = ["resources/*.json", "_vendor/**/*.py", "_vendor/**/*.json", "_vendor/**/*.mo", "_vendor/**/*.mjs", "_vendor/**/*.js", "_vendor/**/*.sh", "_vendor/**/*.sql", "_vendor/**/*.csv", "_vendor/**/*.log", "_vendor/**/*.txt", "_vendor/**/*.mos", "_vendor/**/LICENSE"]

